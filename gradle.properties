# Gradle JVM: Loom (remapping the ~140 MB Cobblemon jar) needs a big heap.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Compile Kotlin inside the Gradle process (no separate Kotlin daemon).
kotlin.compiler.execution.strategy=in-process

# ---- Toolchain (same as cobblemon-ballworks-fabric; must match what runs on the server) ----
# https://maven.fabricmc.net/net/fabricmc/fabric-loom/  -> 1.13.6 is the newest Loom whose
# Gradle module metadata asks for Gradle 8.14 (1.14.x+ require Gradle >= 9.2).
loom_version=1.13.6
kotlin_version=2.2.20
minecraft_version=1.21.1
loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
fabric_kotlin_version=1.13.6+kotlin.2.2.20

# Cobblemon jar: compiled against (its spawn event) and run in dev/gametests.
# Downloaded once into run-libs/ (git-ignored) from Modrinth and verified by SHA-1; it is the
# exact file the modpack/server run. Never shipped inside our jar.
cobblemon_version=1.8.2+1.21.1
cobblemon_url=https://cdn.modrinth.com/data/MdwFAVRL/versions/GJ2a1b8O/Cobblemon-fabric-1.8.2%2B1.21.1.jar
cobblemon_sha1=1a8ec812b2e7b392ac60801c910d3128d0bbb432

# ---- Mod ----
mod_version=1.1.0+1.21.1
maven_group=com.fernandoabf.spawnalerts
archives_base_name=spawnalerts
